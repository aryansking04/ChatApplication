<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Minimalist Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <!-- Brand header -->
            <div class="auth-brand">
                <div class="brand-icon">
                    <i data-lucide="message-square"></i>
                </div>
                <h1 class="brand-title">Aura Chat</h1>
                <p class="brand-subtitle">Private, real-time messaging & media sharing</p>
            </div>

            <!-- Error alert -->
            <div id="auth-alert" class="alert-box hidden" role="alert"></div>

            <!-- Login form -->
            <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <div class="input-wrapper">
                        <i data-lucide="user" class="input-icon"></i>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="e.g. alex or alex@example.com" 
                            required 
                            autocomplete="username"
                            autofocus
                        >
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                    </div>
                    <div class="input-wrapper">
                        <i data-lucide="lock" class="input-icon"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password" 
                            required 
                            autocomplete="current-password"
                        >
                        <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('password', this)" aria-label="Toggle password visibility">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary btn-block">
                    <span class="btn-text">Sign In</span>
                    <i data-lucide="arrow-right" class="btn-icon"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/register">Create one</a></p>
            </div>
        </div>
        
        <div class="auth-micro-badge">
            <span>FastAPI &bull; WebSockets &bull; SQLite</span>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
