<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Minimalist Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <!-- Brand header -->
            <div class="auth-brand">
                <div class="brand-icon">
                    <i data-lucide="sparkles"></i>
                </div>
                <h1 class="brand-title">Create Account</h1>
                <p class="brand-subtitle">Join the distraction-free chat experience</p>
            </div>

            <!-- Error alert -->
            <div id="auth-alert" class="alert-box hidden" role="alert"></div>

            <!-- Register form -->
            <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <i data-lucide="user" class="input-icon"></i>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="e.g. sarah" 
                            required 
                            minlength="3" 
                            maxlength="30"
                            autocomplete="username"
                            autofocus
                        >
                    </div>
                    <span class="field-hint">Alphanumeric, underscores, or hyphens (3-30 chars)</span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail" class="input-icon"></i>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="sarah@example.com" 
                            required 
                            autocomplete="email"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock" class="input-icon"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="At least 6 characters" 
                            required 
                            minlength="6"
                            autocomplete="new-password"
                        >
                        <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('password', this)" aria-label="Toggle password visibility">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Choose Avatar Style</label>
                    <div class="avatar-picker-grid" id="avatar-picker">
                        <label class="avatar-option selected">
                            <input type="radio" name="avatar_seed" value="adventurer" checked onchange="updateSelectedAvatar()">
                            <img src="https://api.dicebear.com/7.x/shapes/svg?seed=ember&backgroundColor=f8fafc" alt="Avatar 1">
                        </label>
                        <label class="avatar-option">
                            <input type="radio" name="avatar_seed" value="bottts" onchange="updateSelectedAvatar()">
                            <img src="https://api.dicebear.com/7.x/shapes/svg?seed=nordic&backgroundColor=f8fafc" alt="Avatar 2">
                        </label>
                        <label class="avatar-option">
                            <input type="radio" name="avatar_seed" value="lorelei" onchange="updateSelectedAvatar()">
                            <img src="https://api.dicebear.com/7.x/shapes/svg?seed=linear&backgroundColor=f8fafc" alt="Avatar 3">
                        </label>
                        <label class="avatar-option">
                            <input type="radio" name="avatar_seed" value="micah" onchange="updateSelectedAvatar()">
                            <img src="https://api.dicebear.com/7.x/shapes/svg?seed=sapphire&backgroundColor=f8fafc" alt="Avatar 4">
                        </label>
                    </div>
                    <input type="hidden" id="profile_picture" name="profile_picture" value="">
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary btn-block">
                    <span class="btn-text">Create Account</span>
                    <i data-lucide="arrow-right" class="btn-icon"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login">Sign in</a></p>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
